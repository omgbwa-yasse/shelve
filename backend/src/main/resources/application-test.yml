spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/shelve_test?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

server:
  port: 8080

app:
  seed:
    # Le jeu de conformité de shelve_test est créé par ConformanceSeeder (Laravel),
    # pas par ce seeder Spring — on évite de dupliquer les données de test.
    enabled: false
