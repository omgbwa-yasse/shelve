spring:
  application:
    name: shelve-backend
  datasource:
    # Base MySQL partagée avec Laravel — voir evolution/PHASE-3-SPRINGBOOT.md §3.0.1.
    url: jdbc:mysql://127.0.0.1:3306/shelve_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ""
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      # Le schéma est détenu par Laravel pendant la coexistence : Spring ne le
      # modifie jamais. `none` évite les frictions de validation de mapping sur
      # les clés composites inhabituelles (floors, shelves) pendant le portage ;
      # la vérification réelle est faite par les tests de conformité.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    # Phase de coexistence : Laravel reste maître du schéma (PHASE-3 §3.0.1).
    # Désactivé pour ne RIEN écrire sur la base partagée (pas même la table
    # d'historique Flyway). Réactivé en `validate` seul à la bascule finale (§3.6).
    enabled: false
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: always

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # Clé de hachage des tokens Sanctum : sha256(plain). Les tokens émis par Laravel
  # et par Spring sont interopérables par construction (même table).
  sanctum:
    token-hash-algorithm: SHA-256
  seed:
    # Seeder du socle (référentiels + paramètres + compte admin) au démarrage.
    # Idempotent : ne crée que ce qui manque.
    enabled: true
  ai:
    # Moteur LLM — provider utilisé par défaut (voir app.ai.providers).
    default-provider: ollama
    timeout-seconds: 120
    providers:
      # Ollama local (API compatible OpenAI). Clé vide, sans authentification.
      ollama:
        type: openai
        base-url: http://127.0.0.1:11434/v1
        api-key: ""
        model: gemma4:e2b
      # OpenAI — surcharger la clé via APP_AI_PROVIDERS_OPENAI_APIKEY.
      openai:
        type: openai
        base-url: https://api.openai.com/v1
        api-key: ${APP_AI_PROVIDERS_OPENAI_APIKEY:}
        model: gpt-4o-mini
      # OpenRouter (accès multi-modèles, ex. anthropic/claude-3.5-sonnet).
      openrouter:
        type: openai
        base-url: https://openrouter.ai/api/v1
        api-key: ${APP_AI_PROVIDERS_OPENROUTER_APIKEY:}
        model: anthropic/claude-3.5-sonnet
      # Anthropic Claude.
      claude:
        type: anthropic
        base-url: https://api.anthropic.com/v1
        api-key: ${APP_AI_PROVIDERS_CLAUDE_APIKEY:}
        model: claude-3-5-sonnet-20241022
      # LM Studio local (serveur OpenAI-compatible sur le port 1234).
      lmstudio:
        type: openai
        base-url: http://127.0.0.1:1234/v1
        api-key: ""
        model: local-model
      # Provider personnalisé (tout serveur OpenAI-compatible).
      custom:
        type: openai
        base-url: ${APP_AI_PROVIDERS_CUSTOM_BASEURL:http://127.0.0.1:8000/v1}
        api-key: ${APP_AI_PROVIDERS_CUSTOM_APIKEY:}
        model: ${APP_AI_PROVIDERS_CUSTOM_MODEL:model}
  sandbox:
    # Workspaces Python de l'assistant IA (D14) — même stockage physique que
    # Laravel (storage/app/ai/sandboxes/{folder}). Chemin absolu du storage.
    root: E:/project/procuregenious/shelve/laravel/storage/app/ai/sandboxes
    # Catalogue des capacités injecté dans le prompt IA.
    capabilities: E:/project/procuregenious/shelve/laravel/storage/app/ai/sandbox/capabilities.json
    timeout-seconds: 120
    ttl-hours: 24
